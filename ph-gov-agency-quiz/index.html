<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Government Agency Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="nav">
            <div class="timer">
                <span class="gui-text">00:30s</span>
            </div>
            <div class="score"><span class="gui-text">3/15</span></div>
        </div>
        <main>
            <div class="agency"><span>DepEd</span></div>
            <div class="input">
                <input type="text" placeholder="What does it stands for?">
            </div>
            <div class="output">
                <span class="name">Answer: Department of Education</span>
                <span class="result">Correct</span>
            </div>
        </main>
    </div>

    <script type="module" src="dist/script.js"></script>
</body>
</html>
